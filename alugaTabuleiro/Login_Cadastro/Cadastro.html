<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de usuário</title>
    <link rel="stylesheet" href="Cadastro.css">
</head>
<body>
    <div class="modal-overlay">
    <div class="modal-card">
        <header>
            <h1>Criar Conta</h1>
            <p>Preencha os dados abaixo para se cadastrar.</p>
        </header>

        <form id="registerForm">
            <div class="input-group">
                <label for="fullName">Nome Completo</label>
                <input type="text" id="fullName" minlength="15" maxlength="80" 
                       pattern="[A-Za-zÀ-ÿ\s]+" title="Apenas letras, entre 15 e 80 caracteres" required>
            </div>

            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="exemplo@email.com" required>
                <span id="emailError" class="error-message"></span>
            </div>

            <div class="input-group">
                <label for="phone">Telefone</label>
                <input type="tel" id="phone" placeholder="(+55) XX-XXXXXXXXX" required>
            </div>

            <div class="address-grid">
                <div class="input-group">
                    <label for="cep">CEP</label>
                    <input type="text" id="cep" maxlength="9" placeholder="00000-000" required>
                </div>
                <div class="input-group">
                    <label for="number">Número</label>
                    <input type="text" id="number" required>
                </div>
            </div>

            <div class="input-group">
                <label for="logradouro">Logradouro</label>
                <input type="text" id="logradouro" readonly>
            </div>

            <div class="input-group">
                <label for="complement">Complemento</label>
                <input type="text" id="complement">
            </div>
           
             <div class="input-group">
                <label for="password">Senha</label>
                <div class="password-wrapper">
                <input type="password" id="password" maxlength="6" placeholder="******" required>
                <button type="button" id="togglePassword" class="toggle-btn">👁️</button>
                </div>
                <span class="password-hint">6 caracteres (letras e números).</span>
            </div>

             <div class="input-group">
                <label for="confirmPassword">Confirmar Senha</label>
                <input type="password" id="confirmPassword" maxlength="6" required>
                <span id="matchError" class="error-message"></span>
                </div>
            

            <button type="submit" class="btn-register">Criar conta</button>
        </form>

        <p class="signup">Já tem conta? <a href="Login2.html">Fazer login</a></p>
    </div>
</div>
<script src="Cadastro.js"></script>
</body>
</html>
