<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Aluga Tabuleiro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/login.css">

</head>

<body>

    <header>
        <div id="header"></div>     
    </header>
<br>
<br>

    <main class="login-page">
        <section class="login-content">
            
            <p class="welcome-text">Bem-vindo! Faça login para continuar.</p>
            <br>


            <form id="loginForm">
                <div class="input-group">
                    <label for="email">E-mail</label>
                    <div class="field-wrapper" id="emailWrapper">
                        <input 
                            type="email" 
                            id="email" 
                            placeholder="seu@email.com" 
                            required 
                            aria-required="true"
                            aria-describedby="emailError" maxlength="80" minlength="13">
                    </div>
                    <span id="emailError" class="error-msg" aria-live="polite"></span>
                </div>

                <div class="input-group">
                    <label for="password">Senha</label>
                    <div class="field-wrapper" id="passwordWrapper">
                        <input 
                            type="password" 
                            id="password" 
                            maxlength="6" 
                            placeholder="••••••" 
                            required 
                            aria-required="true"
                            aria-describedby="passwordError">
                        

                    </div>
                    <span id="passwordError" class="error-msg" aria-live="polite"></span>
                </div>

                <div class="options">
                    <a href="recuperar.html" class="forgot-link">Esqueci minha senha</a>
                </div>

                <button type="submit" class="btn-submit">Entrar</button>
            </form>

            <p class="signup-footer">
                Ainda não tem conta? <a href="cadastro.html">Criar conta grátis</a>
            </p>
        
        </section>
    </main>

    <!-- rodapé -->
    <footer>
        <div id="footer"></div>
    </footer>


    <!-- VLibras -->
    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper></div>
        <div class="vw-plugin-top-wrapper"></div>
    </div>
    
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script> new window.VLibras.Widget(); </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/acessibilidade.js"></script>
    <script src="js/loadComponents.js"></script>
    <script src="js/login.js"></script>
    <script src="database/database.js"></script>
    <script src="js/carrinho.js"></script>

</body>

</html>
