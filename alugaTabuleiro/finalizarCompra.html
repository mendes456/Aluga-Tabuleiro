<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar Compra - Aluga Tabuleiro </title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="css/finalizarCompra.css">


</head>

<body>
    <header>

        <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
            <div class="container-fluid">

                <a class="navbar-brand ms-0" href="index.html">
                    <img src="img/logo.png" class="logo">
                </a>

                <div class="barra-acessibilidade">
                    <div class="container d-flex justify-content-end align-items-center gap-3">

                        <div class="d-flex align-items-center gap-2">
                            <i class="bi bi-universal-access"></i>
                            <span>Acessibilidade |</span>
                        </div>


                        <button class="btn-dark">🌙</button>
                        <button class="btn-diminuir">A-</button>
                        <button class="btn-normal">A</button>
                        <button class="btn-aumentar">A+</button>

                    </div>
                </div>

            </div>
        </nav>
    </header>





    <main>

        <div class="row">

            <!-- 🛒 PEDIDOS -->
            <div class="col-md-7">
                <h3 class="mb-4">Seus Pedidos</h3>

                <div id="lista-pedidos" class="list-group"></div>
            </div>

            <!-- 💰 RESUMO -->
            <div class="col-md-5">
                <div class="resumo-box">

                    <h4 class="mb-3">Resumo do Pedido</h4>

                    <!-- PERÍODO -->
                    <label class="mb-1">Período de aluguel:</label>

                    <select id="periodo" class="form-select mb-3" required>
                        <option value="">Selecione o período</option>
                        <option value="7">7 dias</option>
                        <option value="14">14 dias</option>
                        <option value="21">21 dias</option>
                    </select>

                    <!-- DATA -->
                    <p class="mb-1">Data de devolução:</p>
                    <strong id="data-devolucao">--/--/----</strong>

                    <hr>

                    <hr>


                    <h5>Forma de pagamento</h5>

                    <select id="metodoPagamento" class="form-select mb-3" required>
                        <option value="">Selecione o pagamento</option>
                        <option value="pix">Pix</option>
                        <option value="cartao">Cartão</option>
                    </select>

                    <!-- PIX -->
                    <div id="pagamento-pix">
                        <p>Escaneie o QR Code:</p>
                        <img src="img/pix.png" width="150">
                    </div>

                    <!-- CARTÃO -->
                    <div id="pagamento-cartao" style="display:none;">
                        <input type="text" class="form-control mb-2" placeholder="Número do cartão" required>
                        <input type="text" class="form-control mb-2" placeholder="Nome no cartão" required>
                        <input type="text" class="form-control mb-2" placeholder="Validade (MM/AA)" required>
                        <input type="text" class="form-control mb-2" placeholder="CVV" required>
                    </div>

                    <!-- TOTAL -->
                    <h5>Total: R$ <span id="total">0.00</span></h5>

                    <!-- BOTÃO -->
                    <button onclick="finalizarPedido()" class="btn-finalizar w-100 mt-3">
                    <a href="modalsucesso.html" class="btn-finalizar">Finalizar Pedido</a>
                    </button>

                </div>
            </div>

        </div>

    </main>










    <!-- VLibras -->
    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>

    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        new window.VLibras.Widget();
    </script>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>


    <script src="js/acessibilidade.js"></script>
    <script src="js/finalizarCompra.js"></script>
</body>

</html>
