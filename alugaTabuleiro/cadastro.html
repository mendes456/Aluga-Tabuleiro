<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Aluga Tabuleiro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/cadastro.css">
</head>

<body>

    <header>
        <div id="header"></div>
    </header>

    <main class="page-wrapper" role="main">
        <section class="form-container">                         
            <p class="welcome-text">Faça seu cadastro para continuar.</p>
            <br>
            <form id="cadastroForm" role="form" aria-labelledby="cadastro-title">
                <div class="input-group">
                    <label for="nome">Nome Completo</label>
                    <div class="field-wrapper" id="nomeWrapper">
                        <input type="text" id="nome" placeholder="Mínimo 10 letras" required aria-required="true" aria-describedby="nomeError">
                    </div>
                    <span id="nomeError" class="error-msg" aria-live="polite"></span>
                </div>

                <div class="input-group">
                    <label for="email">E-mail (Login)</label>
                    <div class="field-wrapper" id="emailWrapper">
                        <input type="email" id="email" placeholder="seu@email.com" required aria-required="true" aria-describedby="emailError">
                    </div>
                    <span id="emailError" class="error-msg" aria-live="polite"></span>
                </div>

                <div class="input-group">
                    <label for="telefone">Telefone</label>
                    <div class="field-wrapper" id="telefoneWrapper">
                        <input type="text" id="telefone" placeholder="(+55) XX-XXXXXXXX" aria-describedby="telefoneError">
                    </div>
                    <span id="telefoneError" class="error-msg" aria-live="polite"></span>
                </div>

                <div class="input-group">
                    <label for="cep">CEP</label>
                    <div class="field-wrapper" id="cepWrapper">
                        <input type="text" id="cep" maxlength="9" placeholder="00000-000" aria-describedby="cepError">
                    </div>
                </div>

                <div class="input-group">
                    <label for="logradouro">Logradouro</label>
                    <div class="field-wrapper">
                        <input type="text" id="logradouro" placeholder="Rua, Avenida..." readonly>
                    </div>
                </div>

                <div class="input-group">
                    <label for="numero">Número</label>
                    <div class="field-wrapper">
                        <input type="text" id="numero" placeholder="Ex: 123">
                    </div>
                </div>

                <div class="input-group">
                    <label for="complemento">Complemento</label>
                    <div class="field-wrapper">
                        <input type="text" id="complemento" placeholder="Apto, Bloco...">
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">Senha (6 alfanuméricos)</label>
                    <div class="field-wrapper" id="passwordWrapper">
                        <input type="password" id="password" maxlength="6" placeholder="Ex: a1b2c3" aria-describedby="passwordError">
                    </div>
                </div>

                <div class="input-group">
                    <label for="confirmPassword">Confirmar Senha</label>
                    <div class="field-wrapper" id="confirmWrapper">
                        <input type="password" id="confirmPassword" maxlength="6" placeholder="Repita a senha" aria-describedby="passwordError">
                    </div>
                </div>
                <span id="passwordError" class="error-msg" aria-live="polite"></span>

                <button type="submit" class="btn-submit">Criar minha conta</button>
            </form>
            <p class="footer-link">Já tem uma conta? <a href="login.html">Faça login</a></p>
        </section>
    </main>

    <footer>
        <div id="footer"></div>
    </footer>

    <!-- VLibras -->
    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper></div>
        <div class="vw-plugin-top-wrapper"></div>
    </div>

    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>new window.VLibras.Widget();</script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/acessibilidade.js"></script>
    <script src="js/loadComponents.js"></script>
    <script src="database/database.js"></script>
    <script src="js/cadastro.js"></script>

</body>

</html>
