<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - Aluga Tabuleiro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <header>
        <div id="header"></div>
    </header>

    <main class="login-page">
        <section class="login-container">
            <header>
                <img src="img/logotabuleiro.png" alt="Logo Aluga Tabuleiro" class="login-logo">
                <h1>Recuperar Senha</h1>
                <p>Digite seu e-mail para receber as instruções de redefinição.</p>
            </header>

            <form id="recoverForm">
                <div class="input-group">
                    <label for="email">E-mail cadastrado</label>
                    <div class="field-wrapper" id="emailWrapper">
                        <input type="email" id="email" placeholder="seu@email.com" required aria-required="true" aria-describedby="emailError">
                    </div>
                    <span id="emailError" class="error-msg" aria-live="polite"></span>
                </div>

                <button type="submit" class="btn-submit">Enviar Link</button>
            </form>

            <p class="signup-footer">Lembrou a senha? <a href="login.html">Voltar para o Login</a></p>
        </section>
    </main>

    <footer>
        <div id="footer"></div>
    </footer>

    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper></div>
        <div class="vw-plugin-top-wrapper"></div>
    </div>

    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>new window.VLibras.Widget();</script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/acessibilidade.js"></script>
    <script src="js/loadComponents.js"></script>

    <script>
        const updateStatus = (wrapperId, errorId, isValid, message = "") => {
            const wrapper = document.getElementById(wrapperId);
            const errorSpan = document.getElementById(errorId);
            if (wrapper) {
                wrapper.classList.toggle('error-state', !isValid);
                wrapper.classList.toggle('valid-state', isValid);
            }
            if (errorSpan) {
                errorSpan.textContent = message;
            }
        };

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        const emailField = document.getElementById('email');
        const emailError = document.getElementById('emailError');
        const recoverForm = document.getElementById('recoverForm');

        const validateEmail = () => {
            const email = emailField.value.trim();
            const isValid = emailRegex.test(email);
            updateStatus('emailWrapper', 'emailError', isValid, isValid ? '' : 'Digite um e-mail no formato nome@dominio.com.');
            emailField.setAttribute('aria-invalid', String(!isValid));
            return isValid;
        };

        if (emailField) {
            emailField.addEventListener('blur', validateEmail);
            emailField.addEventListener('input', () => {
                if (emailField.value.length > 0) {
                    validateEmail();
                } else {
                    const wrapper = document.getElementById('emailWrapper');
                    const errorSpan = document.getElementById('emailError');
                    if (wrapper) wrapper.classList.remove('error-state', 'valid-state');
                    if (errorSpan) errorSpan.textContent = '';
                    emailField.removeAttribute('aria-invalid');
                }
            });
        }

        if (recoverForm) {
            recoverForm.addEventListener('submit', (e) => {
                e.preventDefault();
                if (!validateEmail()) {
                    emailField.focus();
                    return;
                }

                alert(`Um link de recuperação foi enviado para: ${emailField.value.trim()}`);
                window.location.href = 'login.html';
            });
        }
    </script>

</body>

</html>
