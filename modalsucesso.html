<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido Efetuado</title>       

    <style>     

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #fff;;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: #d86d26;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
            font-size: 20px;
            color: #fff
            ;
            

        }

        .btn-voltar {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #1e9603;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 18px;
        }

        .btn-voltar:hover {
            background-color: #468f06;
        }
    </style>

</head>

<body>

    <div id="modalSucesso" class="modal-overlay">
    
        <div class="modal-content">        
            <h2>Pedido Efetuado!</h2>
            <p>Parabéns! Seu pedido foi realizado com sucesso.</p>
            <button onclick="window.location.href='index.html'" class="btn-voltar">Voltar para Home</button>
        </div>
    </div>

</body>

</html>
